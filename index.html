<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0f3d">
<title>İyi ki Doğdun İlayda</title>
<style>
  :root {
    --bg1: #2a0f3d;
    --bg2: #5b1f5e;
    --pink: #ff7eb6;
    --gold: #ffd166;
    --cream: #fff4e6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    min-height: 100dvh;
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: var(--cream);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    user-select: none;
  }

  /* Yıldızlar */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: #fff; opacity: .6; animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.7); } 50% { opacity: .9; transform: scale(1.2); } }

  /* Başlık */
  header { position: relative; z-index: 2; text-align: center; width: 100%; min-height: 150px; }
  h1 {
    font-size: clamp(2.2rem, 11vw, 4.5rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: 1px;
  }
  h1 .line { display: block; white-space: nowrap; }
  h1 .ch {
    display: inline-block;
    opacity: 0;
    transform: translateY(-80px) scale(.3) rotate(-30deg);
  }
  h1 .sp { display: inline-block; width: .3em; }
  h1.show .ch {
    animation: drop .8s cubic-bezier(.2,1.6,.4,1) forwards, wave 2.4s ease-in-out infinite;
    animation-delay: calc(var(--i) * 80ms), calc(var(--i) * 80ms + 900ms);
  }
  h1 .line.name .ch {
    background: linear-gradient(180deg, var(--gold), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(255,126,182,.6));
    font-size: 1.15em;
  }
  h1 .line:first-child .ch { text-shadow: 0 0 18px rgba(255,209,102,.5); }
  @keyframes drop {
    to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
  }
  @keyframes wave {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .hint {
    margin-top: 10px;
    font-size: 1.05rem;
    opacity: .85;
    animation: pulse 1.8s infinite ease-in-out;
  }
  .hint.hide { display: none; }
  @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  .wish {
    margin-top: 14px; font-size: 1.05rem; opacity: 0; transition: opacity 1s 2.2s;
  }
  .wish.show { opacity: .9; }

  /* Pasta */
  main { position: relative; z-index: 2; flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
  .cake-wrap {
    position: relative;
    width: min(300px, 78vw);
    aspect-ratio: 1 / 1.05;
    cursor: pointer;
    transition: transform .2s;
  }
  .cake-wrap:active { transform: scale(.97); }
  .scale { position: absolute; inset: 0; transform-origin: bottom center; }

  .plate {
    position: absolute; bottom: 0; left: -6%; width: 112%; height: 9%;
    background: linear-gradient(#f3f3f7, #c9c9d6);
    border-radius: 50%;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .layer {
    position: absolute; left: 50%; transform: translateX(-50%);
    border-radius: 14px 14px 10px 10px;
  }
  .layer.bottom {
    bottom: 5%; width: 100%; height: 30%;
    background: linear-gradient(90deg, #c2477e, #e86aa0 40%, #c2477e);
  }
  .layer.middle {
    bottom: 33%; width: 80%; height: 25%;
    background: linear-gradient(90deg, #f5b3cf, #ffd6e7 40%, #f5b3cf);
  }
  .layer.top {
    bottom: 56%; width: 60%; height: 18%;
    background: linear-gradient(90deg, #8f4dd6, #b47cf0 40%, #8f4dd6);
  }
  .icing {
    position: absolute; top: -4px; left: 0; width: 100%; height: 34%;
    background: var(--cream);
    border-radius: 12px 12px 0 0;
  }
  .icing::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 14px;
    background:
      radial-gradient(circle at 10px 0, var(--cream) 9px, transparent 10px) 0 0 / 22px 14px repeat-x;
  }
  .sprinkles { position: absolute; inset: 45% 6% 10%; }
  .sprinkles i {
    position: absolute; width: 10px; height: 4px; border-radius: 2px;
  }
  .cherry {
    position: absolute; width: 8%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff8a8a, #d0102a 65%);
    bottom: 72%;
  }

  /* Mumlar */
  .candles {
    position: absolute; bottom: 73%; left: 50%; transform: translateX(-50%);
    width: 55%; display: flex; justify-content: space-around; align-items: flex-end;
  }
  .candle {
    position: relative; width: 10px; height: 54px; border-radius: 3px;
    background: repeating-linear-gradient(160deg, #fff 0 6px, #64c6ff 6px 12px);
    box-shadow: inset -2px 0 0 rgba(0,0,0,.1);
  }
  .candle:nth-child(2) { height: 62px; background: repeating-linear-gradient(160deg, #fff 0 6px, var(--gold) 6px 12px); }
  .candle:nth-child(3) { height: 58px; background: repeating-linear-gradient(160deg, #fff 0 6px, var(--pink) 6px 12px); }
  .candle::before {
    content: ""; position: absolute; top: -8px; left: 50%; width: 2px; height: 9px;
    background: #333; transform: translateX(-50%);
  }
  .flame {
    position: absolute; left: 50%; top: -34px; width: 16px; height: 28px;
    transform: translateX(-50%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(ellipse at 50% 75%, #fff 0 15%, #ffe066 35%, #ff9f1c 65%, rgba(255,80,0,0) 75%);
    filter: drop-shadow(0 0 10px #ffb703) drop-shadow(0 0 22px rgba(255,160,0,.7));
    animation: flicker .25s infinite alternate ease-in-out;
    transform-origin: 50% 100%;
    transition: opacity .3s, transform .3s;
  }
  @keyframes flicker {
    from { transform: translateX(-50%) scale(1, 1) rotate(-2deg); }
    to   { transform: translateX(-50%) scale(.92, 1.08) rotate(2deg); }
  }
  .out .flame { animation: none; opacity: 0; transform: translateX(-50%) scale(.1, .4); }

  .smoke {
    position: absolute; left: 50%; top: -20px; width: 8px; height: 8px; border-radius: 50%;
    background: rgba(220,220,230,.7); opacity: 0; pointer-events: none;
  }
  .out .smoke { animation: smoke 1.8s ease-out forwards; }
  .out .smoke.s2 { animation-delay: .2s; }
  .out .smoke.s3 { animation-delay: .4s; }
  @keyframes smoke {
    0% { opacity: .8; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + 14px), -80px) scale(4); }
  }

  .glow {
    position: absolute; left: 50%; bottom: 70%; width: 140%; aspect-ratio: 1;
    transform: translate(-50%, 50%);
    background: radial-gradient(circle, rgba(255,190,80,.35), transparent 60%);
    pointer-events: none; transition: opacity .6s;
    animation: glowPulse 1.5s infinite alternate;
  }
  @keyframes glowPulse { from { opacity: .8; } to { opacity: 1; } }
  .out .glow { opacity: 0 !important; animation: none; }

  footer { position: relative; z-index: 2; min-height: 44px; }
  .btn {
    border: 0; padding: 12px 22px; border-radius: 999px; font-size: 1rem; font-weight: 600;
    color: var(--bg1); background: linear-gradient(90deg, var(--gold), var(--pink));
    box-shadow: 0 6px 20px rgba(255,126,182,.4);
    opacity: 0; pointer-events: none; transition: opacity .6s 3s;
  }
  .btn.show { opacity: 1; pointer-events: auto; }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

  @media (prefers-reduced-motion: reduce) {
    h1.show .ch { animation: drop .01s forwards; }
    .flame { animation: none; }
  }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <canvas id="confetti"></canvas>

  <header>
    <h1 id="title" aria-label="İyi ki doğdun İlayda"></h1>
    <p class="hint" id="hint">Mumları üflemek için pastaya dokun 🎂</p>
    <p class="wish" id="wish">Nice mutlu, sağlıklı ve güzel yıllara! 💖</p>
  </header>

  <main>
    <div class="cake-wrap" id="cake" role="button" aria-label="Pasta - mumları söndür" tabindex="0">
      <div class="scale">
        <div class="glow"></div>
        <div class="plate"></div>
        <div class="layer bottom"><div class="icing"></div><div class="sprinkles"></div></div>
        <div class="layer middle"><div class="icing"></div><div class="sprinkles"></div></div>
        <div class="layer top"><div class="icing"></div></div>
        <div class="candles">
          <div class="candle"><div class="flame"></div><span class="smoke"></span><span class="smoke s2"></span><span class="smoke s3"></span></div>
          <div class="candle"><div class="flame"></div><span class="smoke"></span><span class="smoke s2"></span><span class="smoke s3"></span></div>
          <div class="candle"><div class="flame"></div><span class="smoke"></span><span class="smoke s2"></span><span class="smoke s3"></span></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <button class="btn" id="again">🕯️ Mumları tekrar yak</button>
  </footer>

<script>
(() => {
  const cake = document.getElementById('cake');
  const title = document.getElementById('title');
  const hint = document.getElementById('hint');
  const wish = document.getElementById('wish');
  const again = document.getElementById('again');
  let blown = false;

  /* ---------- Başlık harfleri ---------- */
  const lines = [['İyi ki doğdun', ''], ['İlayda', 'name']];
  let idx = 0;
  lines.forEach(([text, cls]) => {
    const line = document.createElement('span');
    line.className = 'line ' + cls;
    for (const c of text) {
      const s = document.createElement('span');
      if (c === ' ') { s.className = 'sp'; }
      else { s.className = 'ch'; s.textContent = c; s.style.setProperty('--i', idx++); }
      line.appendChild(s);
    }
    title.appendChild(line);
  });

  /* ---------- Yıldızlar ---------- */
  const stars = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    stars.appendChild(s);
  }

  /* ---------- Pasta süsleri ---------- */
  const colors = ['#ffd166', '#06d6a0', '#64c6ff', '#ff7eb6', '#fff', '#b47cf0'];
  document.querySelectorAll('.sprinkles').forEach(box => {
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('i');
      p.style.left = Math.random() * 92 + '%';
      p.style.top = Math.random() * 85 + '%';
      p.style.background = colors[i % colors.length];
      p.style.transform = `rotate(${Math.random() * 180}deg)`;
      box.appendChild(p);
    }
  });
  const top = document.querySelector('.layer.top');
  [18, 46, 74].forEach(x => {
    const c = document.createElement('div');
    c.className = 'cherry';
    c.style.left = `calc(20% + ${x * 0.6}%)`;
    cake.querySelector('.scale').appendChild(c);
  });

  /* ---------- Konfeti ---------- */
  const cv = document.getElementById('confetti');
  const ctx = cv.getContext('2d');
  let W, H, dpr, parts = [], running = false;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  const confColors = ['#ff7eb6', '#ffd166', '#06d6a0', '#64c6ff', '#b47cf0', '#ff5d5d', '#ffffff'];
  function burst(x, y, n, angle, spread, speed) {
    for (let i = 0; i < n; i++) {
      const a = angle + (Math.random() - .5) * spread;
      const v = speed * (0.5 + Math.random() * 0.7);
      parts.push({
        x, y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
        r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
        tilt: Math.random() * Math.PI * 2,
        color: confColors[(Math.random() * confColors.length) | 0],
        shape: Math.random() < .25 ? 'circle' : 'rect',
        life: 0
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vy += 0.18; p.vx *= 0.99; p.vy *= 0.99;
      p.x += p.vx; p.y += p.vy;
      p.r += p.vr; p.tilt += 0.1; p.life++;
      if (p.y > H + 40 || p.life > 600) { parts.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.color;
      if (p.shape === 'circle') {
        ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.scale(1, Math.cos(p.tilt));
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx.restore();
    }
    if (parts.length) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, W, H); }
  }
  function celebrate() {
    const k = W < 500 ? 0.7 : 1;
    burst(0, H * .75, 110 * k, -Math.PI / 3, 0.9, 18);
    burst(W, H * .75, 110 * k, -Math.PI * 2 / 3, 0.9, 18);
    setTimeout(() => burst(W / 2, H * .45, 140 * k, -Math.PI / 2, 2.4, 14), 350);
    let rain = 0;
    const iv = setInterval(() => {
      for (let i = 0; i < 6; i++) burst(Math.random() * W, -20, 1, Math.PI / 2, 0.6, 2);
      if (++rain > 40) clearInterval(iv);
    }, 120);
  }

  /* ---------- Ses (Web Audio) ---------- */
  let ac;
  function audio() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function blowSound() {
    const a = audio();
    const len = a.sampleRate * 0.6;
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    const g = a.createGain(); g.gain.value = 0.35;
    src.connect(f).connect(g).connect(a.destination);
    src.start();
  }
  function popSound(t) {
    const a = audio();
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(600, t);
    o.frequency.exponentialRampToValueAtTime(80, t + 0.15);
    g.gain.setValueAtTime(0.4, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + 0.2);
  }
  function note(freq, t, dur) {
    const a = audio();
    [1, 2].forEach((mult, k) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = k ? 'sine' : 'triangle';
      o.frequency.value = freq * mult;
      const vol = k ? 0.05 : 0.22;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.95);
      o.connect(g).connect(a.destination);
      o.start(t); o.stop(t + dur);
    });
  }
  const N = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
  const song = [
    ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
    ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
    ['G4', .75], ['G4', .25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
    ['F5', .75], ['F5', .25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 3]
  ];
  function playSong() {
    const a = audio();
    const beat = 0.42;
    let t = a.currentTime + 0.5;
    popSound(t - 0.3);
    song.forEach(([n, b]) => { note(N[n], t, b * beat); t += b * beat; });
  }

  /* ---------- Etkileşim ---------- */
  function blow() {
    if (blown) return;
    blown = true;
    cake.classList.add('out');
    hint.classList.add('hide');
    blowSound();
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    setTimeout(() => {
      title.classList.remove('show'); void title.offsetWidth; title.classList.add('show');
      wish.classList.add('show');
      again.classList.add('show');
      celebrate();
      playSong();
    }, 450);
  }
  cake.addEventListener('click', blow);
  cake.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); blow(); } });

  again.addEventListener('click', () => {
    blown = false;
    cake.classList.remove('out');
    again.classList.remove('show');
    wish.classList.remove('show');
    hint.classList.remove('hide');
  });

  // İlk açılışta başlık animasyonla gelsin
  requestAnimationFrame(() => title.classList.add('show'));
})();
</script>
</body>
</html>
